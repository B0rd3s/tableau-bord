name: Cours Airbus
on:
  schedule:
    - cron: "*/15 7-17 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer le cours
        run: |
          curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/AIR.PA?interval=1d&range=5d" -o raw.json
          python3 - <<'EOF'
          import json
          m = json.load(open("raw.json"))["chart"]["result"][0]["meta"]
          p = m["regularMarketPrice"]
          c = m["chartPreviousClose"]
          json.dump({"prix": round(p, 2), "var": round((p - c) / c * 100, 2), "maj": m["regularMarketTime"]}, open("data.json", "w"))
          EOF
      - name: Publier
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "maj" || exit 0
          git push
